name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (standard library only, no network)
        run: python -m unittest discover -s tests -v
      - name: Scripts start and print help
        run: |
          python -I ads-ops/ads_ops.py --help
          python -I ads-ops/langcheck_ads.py --help
          python -I sample-client/tallo/score.py
